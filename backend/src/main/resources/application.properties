#=== CONFIGURACION DE MYSQL ===
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/carepet?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Marzo_20}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#=== CONFIGURACION DE JPA/HIBERNATE ===
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

#=== CONFIGURACION DEL SERVIDOR ===
server.port=${PORT:8080}

#=== CONFIGURACION DE JWT ===
jwt.secret=${JWT_SECRET:mi-secret-key-super-segura-para-desarrollo-cambiar-en-produccion-minimo-256-bits-de-longitud}
jwt.expiration=${JWT_EXPIRATION:604800000}